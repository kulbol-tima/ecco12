spring:
  datasource:
    url: jdbc:h2:mem:espdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8083

crypto:
  key: 12345678901234567890123456789012
