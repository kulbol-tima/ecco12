spring:
  application:
    name: ESP

  datasource:
    url: ${ESP_DB_URL}
    username: ${ESP_DB_USER}
    password: ${ESP_DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api/esp
  port: ${ESP_SERVER_PORT}

