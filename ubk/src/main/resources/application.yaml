spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    ubk:
      jdbc-url: ${UBK_DB_URL}
      username: ${UBK_DB_USER}
      password: ${UBK_DB_PASS}
      driver-class-name: org.postgresql.Driver

    common:
      jdbc-url: ${COMMON_DB_URL}
      username: ${COMMON_DB_USER}
      password: ${COMMON_DB_PASS}
      driver-class-name: org.postgresql.Driver

    integration:
      jdbc-url: ${INTEGRATION_DB_URL}
      username: ${INTEGRATION_DB_USER}
      password: ${INTEGRATION_DB_PASS}
      driver-class-name: org.postgresql.Driver

  jpa:
    ubk:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

    common:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

    integration:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api/ubk
  port: ${UBK_SERVER_PORT}

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param


integration-api:
  base-url: ${INTEGRATION_API_BASE_URL}
  x-api-key: ${INTEGRATION_API_X_API_KEY}
  user-name: ${INTEGRATION_API_USER_NAME}
  role-name: ${INTEGRATION_API_ROLE_NAME}
