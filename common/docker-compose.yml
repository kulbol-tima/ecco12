version: '3.8'

services:
  common-app:
    build:
      context: ..
      dockerfile: ./common/Dockerfile
    container_name: common-app
    env_file:
      - ../.env
    environment:
      COMMON_SERVER_PORT: ${COMMON_SERVER_PORT}
      COMMON_DB_URL: ${COMMON_DB_URL}
      COMMON_DB_USER: ${COMMON_DB_USER}
      COMMON_DB_PASS: ${COMMON_DB_PASS}

      INTEGRATION_API_BASE_URL: ${INTEGRATION_API_BASE_URL}
      INTEGRATION_API_X_API_KEY: ${INTEGRATION_API_X_API_KEY}
      INTEGRATION_API_USER_NAME: ${INTEGRATION_API_USER_NAME}
      INTEGRATION_API_ROLE_NAME: ${INTEGRATION_API_ROLE_NAME}

    ports:
      - "${COMMON_PORT:-8080}:${COMMON_SERVER_PORT:-8080}"
    networks:
      - common-network
    restart: unless-stopped

networks:
  common-network:
    driver: bridge
